services:
  # ---------- BACKEND: NestJS API (Web Service) ----------
  # No BullMQ worker — invites send immediately; reminders run via Nest cron in this process.
  # Liveness only — does not ping Postgres/Upstash (saves Neon CU-hours).
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # NODE_ENV=production would skip devDependencies (nest CLI, typescript).
    # Install with --include=dev so the build can compile, then start uses dist/.
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npm run start:prod --workspace=@taskflow/api
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Do not hardcode PORT — Render injects it.
      - key: API_PREFIX
        value: api/v1
      - key: FRONTEND_URL
        value: https://taskflow-web-9ocr.onrender.com

      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

      # Upstash Redis TCP — caching only (single REDIS_URL)
      - key: REDIS_URL
        sync: false

      - key: TASK_REMINDER_LEAD_MINUTES
        value: "60"
      - key: WORKSPACE_INVITATION_TTL_HOURS
        value: "168"

      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      - key: AWS_REGION
        sync: false
      - key: S3_TASK_IMAGES_BUCKET
        sync: false
      - key: S3_PRESIGNED_URL_TTL_SECONDS
        value: "900"
      - key: TASK_IMAGE_MAX_BYTES
        value: "5242880"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # ---------- FRONTEND: React + Vite (Static Site) ----------
  - type: web
    name: taskflow-web
    runtime: static
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://taskflow-api-mdhj.onrender.com/api/v1
